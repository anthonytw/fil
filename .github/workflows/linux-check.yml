# Manual Linux check. Not a merge gate: the gate is `just ci` run locally (CLAUDE.md).
# Run with `gh workflow run linux-check` (optionally `-f ref=BRANCH -f suite=check|realnet|aarch64|all`),
# then `gh run watch`.
name: linux-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to check
        required: false
        default: main
      suite:
        description: "check (just ci, harnesses, musl build), realnet (real OpenSSH and Linux network tests), aarch64 (static fil binary for the lab Pis, docs/m1/pi.md) or all (check, realnet and aarch64)"
        type: choice
        options: [check, realnet, aarch64, all]
        default: check
      strict:
        description: "realnet: fail on known findings in fil (KNOWN-BUG in the results) instead of recording them"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: inputs.suite != 'realnet' && inputs.suite != 'aarch64'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
      - name: just ci
        run: just ci
      - name: Emulator fidelity harness
        run: just fidelity --no-perf
      - name: Link simulator soak
        run: just netsim-soak
      - name: Prediction guard sweep
        run: just predict-mutants
      - name: Prediction PTY harness (real programs on Linux PTYs)
        run: just predict-harness --seeds 2 --keys 60
      - name: Client terminal tests (raw mode, signals and window size on a Linux PTY)
        run: just client-pty

  musl:
    # Static builds are a release target (DESIGN.md §13). Informational for now.
    if: inputs.suite != 'realnet' && inputs.suite != 'aarch64'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build for x86_64-unknown-linux-musl
        run: cargo build --workspace --all-targets --target x86_64-unknown-linux-musl

  realnet:
    # Tier 1 of the environment tests (docs/m1/realnet.md), on the real `fil` binary: real OpenSSH
    # in Docker containers (ssh part), the real Linux network stack with NAT and tc netem in
    # network namespaces (udp part) and a systemd host in a privileged container (sysd part).
    # Three parts, run in parallel, each through `just realnet PART`.
    # The sysd part runs a PRIVILEGED container (root on the machine). That is fine on a
    # GitHub-hosted runner, which is a throwaway VM; never run this job on a self-hosted or lab
    # runner.
    if: inputs.suite != 'check' && inputs.suite != 'aarch64'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [ssh, udp, sysd]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Packages (musl for static binaries; namespace and firewall tools)
        run: sudo apt-get update && sudo apt-get install -y musl-tools conntrack ethtool iproute2 iptables openssh-server
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - name: Lint the harness scripts
        run: shellcheck -x -S warning tests/realnet/*.sh tests/realnet/docker/entrypoint.sh
      - name: Real-network suite (${{ matrix.part }})
        env:
          # A known finding in fil (KNOWN-BUG in the results) fails the scenario when strict.
          REALNET_STRICT: ${{ inputs.strict && '1' || '0' }}
        run: just realnet ${{ matrix.part }}
      - name: Logs and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realnet-${{ matrix.part }}
          path: |
            target/realnet/logs
            target/realnet/run
            target/realnet/results-*.tsv
          if-no-files-found: ignore
          retention-days: 14

  aarch64:
    # The release binary for aarch64 Linux (DESIGN.md §13): static, musl. `ring` needs a musl C
    # cross compiler, which `cross` brings in its Docker image. Uploads `fil` and `fil.sha256`
    # for the lab Raspberry Pis (docs/m1/pi.md): `gh run download RUN -n fil-aarch64-musl`.
    if: inputs.suite == 'aarch64' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # TODO (before the repo goes public): pin every action in this file to a commit SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # `cross` mounts the workspace into a third-party image; leave no token in .git/config.
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          # Pinned, with the image in Cross.toml pinned by digest: the same commit builds the same
          # binary. Bump both together.
          tool: cross@0.2.5
      - uses: Swatinem/rust-cache@v2
      - name: Build fil for aarch64-unknown-linux-musl
        run: cross build --locked --release -p fil --target aarch64-unknown-linux-musl
      - name: Check and checksum
        run: |
          mkdir -p out
          cp target/aarch64-unknown-linux-musl/release/fil out/fil
          file out/fil | tee /dev/stderr | grep -E 'ELF 64-bit.*ARM aarch64.*(statically linked|static-pie linked)'
          (cd out && sha256sum fil | tee fil.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: fil-aarch64-musl
          path: out/
          retention-days: 14
