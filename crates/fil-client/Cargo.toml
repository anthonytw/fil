[package]
name = "fil-client"
description = "The fil client: attach, resume and reconnect over any link, the terminal, escapes, the disconnect status line and offline input (DESIGN.md sections 4, 5.2, 6)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
fil-forward = { path = "../fil-forward" }
fil-predict = { path = "../fil-predict" }
fil-proto = { path = "../fil-proto" }
fil-term = { path = "../fil-term", default-features = false, features = ["alacritty"] }
fil-transport = { path = "../fil-transport" }
# Safe termios, poll and fd I/O for the real terminal (DESIGN.md section 13).
rustix = { version = "1", features = ["termios", "stdio", "event", "fs", "process", "pipe"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal", "process", "io-util"] }
tracing = "0.1"

[dev-dependencies]
rustix = { version = "1", features = ["termios", "stdio", "event", "fs", "pty", "process"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "test-util", "macros", "time", "sync", "signal", "process", "io-util", "net"] }

[lints]
workspace = true
