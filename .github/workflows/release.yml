# The release workflow (docs/m4/release.md, docs/m4/plan.md "REL"; DESIGN.md section 13, Builds).
#
#   push of a `v*` tag   builds the release files and opens a DRAFT GitHub Release with build
#                        provenance attestations. Never published: the owner runs
#                        `just release-verify`, signs SHA256SUMS offline and publishes the draft.
#   workflow_dispatch    a DRY RUN from any ref (`gh workflow run release.yml --ref BRANCH`): the same
#                        builds and checks, artifacts uploaded to the run. Nothing is published, no
#                        attestation is made, and the jobs it runs have no `id-token` or
#                        `attestations` permission at all.
#
# Supply chain, enforced by `just release-test` (tests/release/lint-workflow.sh):
#   - every action is pinned by full commit SHA (the comment names the tag; to bump one, resolve the
#     tag to its commit with `gh api repos/OWNER/REPO/git/ref/tags/TAG`, dereferencing an annotated
#     tag, and change the SHA and the comment together);
#   - the tools install-action fetches, and `cross`, are pinned to a version, and the images `cross`
#     builds in are pinned by digest in Cross.toml;
#   - no secret, no cache, no `pull_request_target`; `--locked` on every cargo and cross build;
#     checkout leaves no token in .git/config;
#   - only the `publish` job has `contents: write`, `id-token: write` and `attestations: write`, and
#     it runs only on a `v*` tag push.
# A workflow file on some other branch could still ask for an `id-token`. The attestation's real
# check is the narrow one in `just release-verify` (`gh attestation verify --signer-workflow
# --source-ref`), plus the tag ruleset that keeps anyone else from creating a `v*` tag. The tag
# checks in `prepare` catch mistakes; they are not the gate (tests/release/prepare.sh).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tools the build jobs install; install-action fetches exactly these versions.
  RELEASE_TOOLS: just@1.59.0,cross@0.2.5

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      epoch: ${{ steps.prepare.outputs.epoch }}
      release: ${{ steps.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history: the checks read the previous tags and the golden at them.
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0
      - name: Version, source date and tag checks
        id: prepare
        run: tests/release/prepare.sh
      - name: The release tree's dependency graph
        run: just release-deps
      - name: Lint the release scripts
        run: shellcheck -x -S warning tests/release/*.sh
      - name: The release scripts' own tests (workflow lint, tag signers, release-check)
        run: just release-test

  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
        # Two builds of every Linux target, in two jobs: the package job fails if they differ.
        attempt: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `cross` mounts the workspace into a third-party image; leave no token in .git/config.
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: ${{ env.RELEASE_TOOLS }}
      # No rust-cache here or in any release job: this job produces what gets installed, and a cache
      # entry saved by a run of any other ref could seed it.
      - name: Build (cross, digest-pinned image)
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
          TARGET: ${{ matrix.target }}
        run: tests/release/build-binary.sh "$TARGET" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}-${{ matrix.attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: prepare
    # Apple silicon builds both architectures; the Intel half is built, not run, here.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Best effort: the package job records whether the two builds match and does not gate on it.
        attempt: [a, b]
    env:
      # An explicit Xcode, not whatever the image defaults to; macos-build.sh records it.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0
      - name: Build both architectures and join them with lipo
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: tests/release/macos-build.sh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-universal-apple-darwin-${{ matrix.attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [prepare, build-linux, build-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: in
      - name: Lay out the two sets of binaries; the Linux builds must be identical
        run: |
          set -euo pipefail
          for set in a b; do
            for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl universal-apple-darwin; do
              mkdir -p "sets/$set/$t"
              cp "in/bin-$t-$set/$t/fil" "sets/$set/$t/fil"
              chmod 755 "sets/$set/$t/fil"
            done
          done
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            if cmp "sets/a/$t/fil" "sets/b/$t/fil"; then
              echo "$t: both builds are identical: $(sha256sum "sets/a/$t/fil" | cut -d' ' -f1)"
            else
              echo "::error::the two $t builds differ: $(sha256sum "sets/a/$t/fil" "sets/b/$t/fil" | tr '\n' ' ')"
              exit 1
            fi
          done
          # macOS is best effort: record whether the two builds match, do not gate on it.
          if cmp sets/a/universal-apple-darwin/fil sets/b/universal-apple-darwin/fil; then
            echo "universal-apple-darwin: both builds are identical: $(sha256sum sets/a/universal-apple-darwin/fil | cut -d' ' -f1)"
          else
            echo "::warning::the two macOS builds differ (best effort, not gated): $(sha256sum sets/a/universal-apple-darwin/fil sets/b/universal-apple-darwin/fil | tr '\n' ' ')"
          fi
      - name: Archives, source archive and SHA256SUMS (assembled in the pinned image), twice
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
        run: |
          set -euo pipefail
          mkdir -p info
          {
            docker version --format 'docker {{.Server.Version}}'
            cargo --version
            tests/release/package.sh --bins sets/a --out out
            tests/release/package.sh --bins sets/b --out out-b
          } 2>&1 | tee info/build-info.txt
          # The archives must not depend on which job built the binaries. The macOS archive differs
          # when the two macOS builds do (best effort); the others are gated.
          for f in $(cd out && ls fil-*-x86_64-linux-musl.tar.gz fil-*-aarch64-linux-musl.tar.gz fil-*-source.tar.gz); do
            cmp "out/$f" "out-b/$f" || { echo "::error::$f differs between the two assemblies"; exit 1; }
          done
          cmp out/fil-*-universal-apple-darwin.tar.gz out-b/fil-*-universal-apple-darwin.tar.gz \
            || echo "::warning::the two macOS archives differ (the macOS builds do; best effort)"
      - name: Release check (a tag push also needs the complete layout, the changelog and the tag)
        env:
          RELEASE: ${{ needs.prepare.outputs.release }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE" = true ]; then
            tests/release/check.sh --tag "$TAG" --complete out
          else
            tests/release/check.sh --dry-run out
          fi
      - name: Summary
        run: |
          {
            echo '### Release files'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info
          path: info/
          retention-days: 14

  smoke-macos:
    needs: [prepare, package]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: The macOS archive runs, both halves of it, and release-check passes on macOS too
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir x && tar -xzf "out/fil-$VERSION-universal-apple-darwin.tar.gz" -C x
          bin="x/fil-$VERSION-universal-apple-darwin/bin/fil"
          lipo -info "$bin"
          codesign -vv "$bin"
          "$bin" --version
          # The Intel half under Rosetta, where the runner has it.
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            arch -x86_64 "$bin" --version
          else
            echo "::warning::no Rosetta on this runner: the x86_64 half was not run"
          fi
          if [ "$RELEASE" = true ]; then
            tests/release/check.sh --tag "$TAG" --complete --no-tree out
          else
            tests/release/check.sh --dry-run --no-tree out
          fi

  publish:
    # The only job with write permissions, and only on a tag push. It makes a DRAFT.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, package, smoke-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # the build provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: The files are the ones that were checked
        run: (cd out && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/fil-*.tar.gz
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tests/release/notes.sh "$VERSION" "$GITHUB_REPOSITORY" > notes.md
          gh release create "$TAG" --draft --verify-tag --title "fil $VERSION" --notes-file notes.md \
            out/fil-*.tar.gz out/SHA256SUMS
