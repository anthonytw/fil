[package]
name = "fil"
description = "The fil binary: the CLI, the config file, the client's dialer (pipe and direct QUIC under the path manager) and the remote-side entry points (DESIGN.md sections 8, 14)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fil"
path = "src/main.rs"

# The drivers are examples; their unit tests (exact sequence checks, target rules) run in `just ci`.
[[example]]
name = "dropin"
test = true

[[example]]
name = "pi_e2e"
test = true

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
fil-client = { path = "../fil-client" }
fil-daemon = { path = "../fil-daemon" }
fil-forward = { path = "../fil-forward" }
fil-proto = { path = "../fil-proto" }
fil-transport = { path = "../fil-transport" }
# `localtime_r`, for the time zone of `fil ports` (rustix has no time zone calls): one narrow
# `unsafe` in src/localtime.rs.
libc = "0.2"
rustix = { version = "1", features = ["system", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
# The test hooks (FIL_TEST_WIRE_REVISION, FIL_TEST_SOCKET_DIR) for the `fil` binary the integration
# tests run. Dev-dependencies are not in the released build: `just release-deps` checks.
fil-daemon = { path = "../fil-daemon", features = ["test-hooks"] }
fil-session = { path = "../fil-session" }
fil-term = { path = "../fil-term" }
# The PTY driver the Pi examples share with ptydrive (examples/support/harness.rs).
fil-testbins = { path = "../fil-testbins" }
portable-pty = "0.9"
nix = { version = "0.28", default-features = false, features = ["term"] }
vt100 = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "test-util"] }

[lints]
workspace = true
