# fil's CI on the project's Gitea, run by the self-hosted aarch64 runner.
#
# Gitea reads .gitea/workflows/ and ignores .github/workflows/ when the former exists, so the
# GitHub workflows (release, linux-check, macos-check) do not run here. They run on GitHub, when the
# owner pushes there at release time. There is no macOS runner: macOS checks are run by hand.
#
# The job image is the runner's default (rust:1.99.1-trixie by digest). It has no Node, so no
# JavaScript actions: checkout is plain git. Jobs have no Docker socket (no cross, no realnet) and
# mount no volume. Nothing here uses a secret; the job token is read-only for this repo and is used
# only for the fetch.
#
# Nothing outlives a job. The runner cannot tell a pull request from a push (a PR can edit this
# file), so any cache shared between jobs is one a PR could poison for a later run of main. Every
# job therefore starts from the image alone: a fresh cargo home (crates are downloaded and checked
# against Cargo.lock each run, a few seconds), a fresh target directory, and the tools downloaded
# as release binaries pinned by sha256 (a few seconds; building them would take minutes). The
# shared build cache saved about 30 s of a 25-minute check, so it is not worth what it exposed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: orin-aarch64
    timeout-minutes: 60
    container:
      # --init: a reaper as PID 1, so that the processes fil's tests orphan do not stay zombies
      # (which kill(pid, 0) still finds alive). No volumes: see the header.
      options: --init
    env:
      CARGO_TARGET_DIR: /tmp/fil-target
      CARGO_TERM_COLOR: never
      # The container sees every core of the host but is capped at 6 CPUs: the default (one test
      # thread per core) oversubscribes it and starves tests that wait on real time.
      RUST_TEST_THREADS: "4"
    steps:
      - name: Checkout (plain git; the image has no Node for actions/checkout)
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Packages (systemd-tmpfiles, which crates/fil-daemon/tests/tmp_clean.rs runs for real)
        run: apt-get update -qq && apt-get install -y -qq systemd-standalone-tmpfiles
      - name: Tools (versions as in .github/workflows/linux-check.yml; release binaries, pinned by sha256)
        # The upstream aarch64 musl release assets. A hash is that of the .tar.gz, as the release
        # lists it; to bump a tool, change the version and the hash together.
        run: |
          set -euo pipefail
          get_tool() { # url sha256 path-in-archive
            local f
            f="$RUNNER_TEMP/$(basename "$1")"
            curl -fsSL --retry 3 -o "$f" "$1"
            echo "$2  $f" | sha256sum -c -
            tar -xzf "$f" -C "$RUNNER_TEMP" "$3"
            install -o root -g root -m 755 "$RUNNER_TEMP/$3" /usr/local/bin/
          }
          gh=https://github.com
          get_tool $gh/casey/just/releases/download/1.59.0/just-1.59.0-aarch64-unknown-linux-musl.tar.gz \
            23871b1702bfd550fb5f901778fd4290ecf2ee034a45a889fbe96d89b188086d just
          get_tool $gh/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-aarch64-unknown-linux-musl.tar.gz \
            995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d cargo-deny-0.20.2-aarch64-unknown-linux-musl/cargo-deny
          get_tool $gh/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-aarch64-unknown-linux-musl.tar.gz \
            eb4d9ff6ebd2518152a8308729431a04b3836e71d2bd5ead7aea69f91a71162e cargo-about-0.9.3-aarch64-unknown-linux-musl/cargo-about
          just --version; cargo deny --version; cargo about --version; python3 --version; nproc
          echo "build directory: $CARGO_TARGET_DIR (${{ github.event_name }})"
      - name: just ci (as an unprivileged user, umask 022)
        # Not root: PR code has no business running as root here (fil-daemon's ports::tests no
        # longer need it, issue #8, and no test is checked as root). The jobs also start with umask 002,
        # which fil-client's offline-log test cannot take (it refuses a group-writable log directory).
        run: |
          useradd -m -u 1000 ci
          # Everything ci may write: the checkout, the build directory and cargo's crate download
          # directories (the tools and the toolchain stay root's).
          mkdir -p "$CARGO_TARGET_DIR" /usr/local/cargo/registry /usr/local/cargo/git
          chown -R ci:ci "$GITHUB_WORKSPACE" "$CARGO_TARGET_DIR" /usr/local/cargo/registry /usr/local/cargo/git
          chown ci:ci /usr/local/cargo
          HOME=/home/ci setpriv --reuid=ci --regid=ci --init-groups sh -c 'umask 022; just ci'

  musl:
    name: musl (static release binaries, build only)
    runs-on: orin-aarch64
    timeout-minutes: 60
    # A smoke test that the static targets still build, not the release path (that is `cross` in
    # Cross.toml, on GitHub). Like check, it mounts no volume (header). It runs PR code as root,
    # which is fine only because nothing it writes outlives the job.
    env:
      CARGO_TERM_COLOR: never
      ZIG_VERSION: "0.16.0"
      ZIG_SHA256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    steps:
      - name: Checkout (plain git)
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraHeader="Authorization: token ${{ github.token }}" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Toolchain (from rust-toolchain.toml, with both musl targets)
        run: rustup toolchain install && rustc --version
      - name: Packages (musl-tools for aarch64, xz for the zig tarball)
        run: apt-get update -qq && apt-get install -y -qq musl-tools xz-utils
      - name: zig (pinned by hash) and cargo-zigbuild
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.24.1
          /opt/zig/zig version; cargo install --list | grep '^cargo-zigbuild'
      - name: Build fil, aarch64-unknown-linux-musl (native, musl-gcc)
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release -p fil-shell --target aarch64-unknown-linux-musl
      - name: Build fil, x86_64-unknown-linux-musl (cargo zigbuild)
        run: cargo zigbuild --locked --release -p fil-shell --target x86_64-unknown-linux-musl
      - name: Check that both are static
        run: |
          for t in aarch64 x86_64; do
            f=target/$t-unknown-linux-musl/release/fil
            file "$f" | tee /dev/stderr | grep -E '(statically linked|static-pie linked)'
          done
