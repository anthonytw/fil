# macOS check: the PR gate on every pull request, the extended set on every push of main, and any
# suite by hand. `suite=check` on the PR head is part of the merge gate (CLAUDE.md § Delivery).
# Run by hand with `gh workflow run macos-check` (optionally `-f ref=BRANCH -f suite=check|extended|all|remote|brew`),
# then `gh run watch`. The ref's build scripts and tests run on the runner, so the workflow uses no
# secret and asks for no write permission. The extended run of each push of main is what saves the
# rust-cache every other run restores (save-if below).
#
# Suites (docs/m4/plan.md, MAC; the tiers: docs/dev/timing-tests.md "Tiers"; the CI rework for 0.2.1):
#   check     the PR gate, about 10 min (21 on the release paths), Apple silicon only: `check (arm64)` (clippy, the OS tests
#             `just test-os` (pure logic runs on Linux), a cross `cargo check` of the Intel build,
#             the PTY tests) and `release-test (arm64)` (the release scripts' own tests, when the
#             change touches the release paths, tests/ci/release-paths.sh).
#   extended  once per merge batch on `main` (the run of each push of main,
#             which also saves the rust-cache every other run restores; save-if below), about 15 min:
#             the gate's jobs, with the prediction harness and the drop-in quick set against a
#             private local daemon in `check (arm64)`, and macOS as the remote host over the
#             user-mode sshd.
#   all       the release candidate (`tests/release/just.sh release` dispatches it), about 20 min:
#             `check (arm64)` with the harness, the full drop-in suite in a job of its own, the
#             remote host over both sshds, and brew when `release_run` names a dry run. No Intel test
#             run: no code here depends on the architecture (both are 64-bit little endian, the
#             same kernel interfaces); the Intel half of the universal binary runs in release.yml's
#             smoke-macos (under Rosetta, which it requires) and brew's Intel job. No release-test:
#             linux-check's runs once per candidate, release.yml its own.
#   remote, brew  one area on its own.
#
# Jobs:
#   check   the suites on macOS (Apple silicon), above.
#   dropin  suite=all: the full drop-in suite against a private local daemon (the daemon on macOS,
#           real PTYs, real macOS tools, zsh).
#   release-test  the release scripts' own tests on macOS, for the BSD userland of the scripts the
#           owner runs on a Mac (and the macOS signing fakes): per PR when the change touches the
#           release paths.
#   remote  macOS as the REMOTE host (DESIGN.md §16.9): the real `fil` served over a real ssh login
#           to the runner itself (tests/macos/remote.sh, `just macos-remote`), with a user-mode sshd
#           (extended, all, remote) and with the system sshd (all, remote). It includes the
#           in-place-upgrade (trampoline) case, which records a known finding rather than failing
#           unless `strict`.
#
#   brew    the Homebrew formula (packaging/homebrew/fil.rb.in, docs/m4/packaging.md section 4), on
#           Apple silicon and Intel: rendered against the archives of a release dry run, put in a
#           scratch tap, then `brew install`, `brew test` and `brew audit --strict`. The archives
#           come from a dry run named by the `release_run` input (a `release` workflow run on this
#           repository, downloaded with the job's own token, which has `actions: read` and nothing
#           else), not from a build here: building the universal binary and both Linux archives
#           takes the release workflow about 20 minutes, and the formula is what is under test.
#           In `all` it runs only when `release_run` is given. The only Intel runner left.
#
# Triggers: the jobs read the suite as `inputs.suite`, else `extended` for a push (of main: the
# only push this runs on) and `check` for a pull request (tests/release/lint-workflow.sh's check
# profile allows exactly these forms, C2; never pull_request_target). The gate's
# job names (`check (arm64)`, `release-test (arm64)`) are what a ruleset requires: keep them
# (release.sh also finds a suite=all run by its `check (` and `remote (` jobs).
#
# Runner images. Apple silicon is `macos-15` (the newest image this was written against; macOS 14
# images were retired on 2026-11-02). Intel is `macos-15-intel` (brew only), GitHub's LAST Intel
# image: it retires in fall 2027, and after that brew's Intel row has to go (docs/m4/plan.md §2.2). A label that no longer exists leaves a
# job queued rather than failing it, so check the list at https://github.com/actions/runner-images
# before a release candidate.
#
# Supply chain: every action is pinned by full commit SHA (the comment names the release tag), the
# tools install-action fetches are pinned to a version, and every checkout drops its token. To bump
# an action, resolve the new tag to its commit (`gh api repos/OWNER/REPO/git/ref/tags/TAG`, and
# dereference it if it is an annotated tag) and change the SHA and the comment together.
name: macos-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to check
        required: false
        default: main
      suite:
        description: "check (the PR gate, Apple silicon: clippy, OS tests, PTY tests; the release scripts' tests when the release paths change), extended (per merge batch on main: the gate, the prediction harness, the drop-in quick set, the remote host over the user sshd), all (the release candidate: OS tests, harness, the full drop-in suite, the remote host over both sshds, brew with release_run), remote (macOS as the remote host, over a real ssh login to the runner) or brew (the Homebrew formula; needs release_run)"
        type: choice
        options: [check, extended, all, remote, brew]
        default: check
      release_run:
        description: "brew: ID of a successful `release` workflow run (a dry run) whose release-files artifact the formula is tested against"
        required: false
        default: ""
      strict:
        description: "remote: fail on known findings in fil (KNOWN-BUG in the results) instead of recording them"
        type: boolean
        default: false
  # The PR gate on every pull request (suite=check: the jobs read the suite from the event), and
  # the extended set on every push of main (each merge batch; the run that saves the rust-cache).
  # A fork's pull request runs with a read-only token and no secret (none is used here). Only these
  # two forms are allowed (tests/release/lint-workflow.sh --check, C2).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR (or branch) and suite: a newer push to a PR cancels its older run. A dispatch is
# keyed by its `ref` input as well (a re-dispatch of the same head replaces the older one; another
# head or suite runs beside it), and a push of main by its commit, so that nothing on main is ever
# cancelled or replaced while it waits: each merge batch's run, and the release's suite=all, run to
# the end.
concurrency:
  group: macos-check-${{ github.event.pull_request.number || github.ref }}-${{ inputs.suite || github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: contains(fromJSON('["check","extended","all"]'), (inputs.suite || (github.event_name == 'push' && 'extended' || 'check')))
    # A fixed name, not a matrix label: the ruleset requires it, and release.sh finds a suite=all
    # run by its `check (` prefix.
    name: check (arm64)
    runs-on: macos-15
    # suite=check about 10 min (19.5 with the drop-in smoke run and the harness, 2026-11-11);
    # extended adds the harness and the drop-in quick set (about 4 more).
    timeout-minutes: 40
    env:
      SUITE: ${{ (inputs.suite || (github.event_name == 'push' && 'extended' || 'check')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The ref's build scripts and tests run in this job; leave no token in .git/config.
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0,cargo-nextest@0.9.149
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The dropin job restores this job's cache (`shared-key: check` there is this job's own
          # key; main's extended run builds the drop-in suite here).
          # Restore always; save only from main's own run (the extended set after each push of
          # main): a run on any other ref must not seed a cache that a later run of main restores.
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.ref == 'main') }}
      - name: Machine
        run: |
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          xcodebuild -version || true
          ulimit -Sn; ulimit -Hn
          sysctl kern.ipc.somaxconn
      # The steps run even when an earlier one failed, so one run shows every red step (each is a
      # finding of its own); the job is red if any of them is. Platform-independent checks (deny,
      # notices, fmt, the exporter lock, the workflow tests, release-deps, fidelity, the logic
      # tests) run on Linux.
      - name: Clippy (macOS code paths)
        if: ${{ !cancelled() }}
        run: just clippy
      - name: OS tests, smoke size (PTYs, signals, sockets, processes, login shells)
        if: ${{ !cancelled() }}
        run: just test-os
      - name: The Intel build compiles (cross check)
        if: ${{ !cancelled() }}
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --target x86_64-apple-darwin -p fil-shell
      - name: Client terminal tests (raw mode, signals and window size on a macOS PTY)
        if: ${{ !cancelled() }}
        run: just client-pty
      - name: Prediction PTY harness, smoke (real programs on macOS PTYs; extended and all)
        if: ${{ !cancelled() && env.SUITE != 'check' }}
        run: just predict-harness --seeds 2 --keys 60
      - name: Drop-in tools (htop; the rest ship with macOS)
        if: ${{ !cancelled() && env.SUITE == 'extended' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install htop
      # The runner's account has /bin/bash 3.2 as its login shell; every Mac a person uses has
      # zsh (the default since macOS 10.15). bash 3.2 has no bracketed paste, which fails three
      # drop-in scenarios (terminal_modes, escape_handling, binary_garbage) for a reason that is
      # the shell's. The runner is a throwaway VM.
      - name: Login shell zsh, as on a Mac a person uses
        if: ${{ !cancelled() && env.SUITE == 'extended' }}
        run: sudo dscl . -create "/Users/$USER" UserShell /bin/zsh && dscl . -read "/Users/$USER" UserShell
      # The quick set (every scenario under about 6 s, and predict_secret) per merge batch; the
      # full suite is the dropin job's, in suite=all.
      - name: Drop-in quick set, local (the daemon on macOS, real PTYs, no ssh; extended)
        if: ${{ !cancelled() && env.SUITE == 'extended' }}
        env:
          SHELL: /bin/zsh
        run: just dropin --local --set quick
      - name: Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-check-arm64
          path: |
            ~/.local/state/fil
          if-no-files-found: ignore
          retention-days: 14

  dropin:
    # suite=all: the full drop-in suite against a private local daemon (about 15 min of scenarios:
    # the 45 s sleeps, the 90 s idle, the stress and the prediction scenarios), beside `check` so
    # that neither waits for the other.
    if: (inputs.suite || (github.event_name == 'push' && 'extended' || 'check')) == 'all'
    name: dropin (arm64)
    runs-on: macos-15
    # 16.5 min of drop-in in the old check job (macos-check 43430991549), with a build first.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The ref's build scripts and tests run in this job; leave no token in .git/config.
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # check's cache (main's; its key is its job id), restored only.
          shared-key: check
          save-if: false
      - name: Machine
        run: |
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          xcodebuild -version || true
          ulimit -Sn; ulimit -Hn
          sysctl kern.ipc.somaxconn
      - name: Drop-in tools (htop; the rest ship with macOS)
        if: ${{ !cancelled() }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install htop
      # The runner's account has /bin/bash 3.2 as its login shell; every Mac a person uses has
      # zsh (the default since macOS 10.15). bash 3.2 has no bracketed paste, which fails three
      # drop-in scenarios (terminal_modes, escape_handling, binary_garbage) for a reason that is
      # the shell's. The runner is a throwaway VM.
      - name: Login shell zsh, as on a Mac a person uses
        if: ${{ !cancelled() }}
        run: sudo dscl . -create "/Users/$USER" UserShell /bin/zsh && dscl . -read "/Users/$USER" UserShell
      - name: Drop-in suite, full, local (the daemon on macOS, real PTYs, no ssh)
        if: ${{ !cancelled() }}
        env:
          SHELL: /bin/zsh
        run: just dropin --local --scale full
      - name: Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dropin-arm64
          path: |
            ~/.local/state/fil
          if-no-files-found: ignore
          retention-days: 14

  release-test:
    # The release scripts' own tests on macOS (`tests/release/just.sh release-test`): the BSD
    # userland of the scripts the owner runs on a Mac, and the macOS signing fakes. A job of its
    # own, beside `check`, so that it neither lengthens nor eats into `check`'s limit; only when
    # the change touches the release paths (otherwise the job ends after the paths step, which on
    # main's own run is always). Not in suite=all: linux-check's release-test runs there once.
    # The job always exists in the gate, so a ruleset can require it.
    if: contains(fromJSON('["check","extended"]'), (inputs.suite || (github.event_name == 'push' && 'extended' || 'check')))
    name: release-test (arm64)
    runs-on: macos-15
    # 18-21.5 min on Apple silicon (the test-suite sweep's data, 2026-11-11; macos-check 43430991549).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The whole history, for the merge base the paths step diffs against (and selftest's
          # own git cases).
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch the release paths?
        id: relpaths
        run: tests/ci/release-paths.sh
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.relpaths.outputs.run == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        if: steps.relpaths.outputs.run == 'true'
        with:
          tool: just@1.59.0
      - name: The release scripts' own tests (macOS signing fakes included)
        if: steps.relpaths.outputs.run == 'true'
        run: tests/release/just.sh release-test

  remote:
    if: contains(fromJSON('["remote","extended","all"]'), (inputs.suite || (github.event_name == 'push' && 'extended' || 'check')))
    name: remote (${{ matrix.sshd }} sshd)
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # user: a user-mode sshd on a high loopback port with throwaway keys (tests/macos/sshd.sh).
        # system: launchd's own sshd on port 22 under the runner's sudo, the real login path; the
        # runner is a throwaway VM and the suite removes what it added.
        # extended: the user-mode sshd only.
        sshd: ${{ fromJSON((inputs.suite || (github.event_name == 'push' && 'extended' || 'check')) == 'extended' && '["user"]' || '["user","system"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: just@1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restore always, save only from main's own run (see check).
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.ref == 'main') }}
      - name: Machine
        run: |
          sw_vers
          uname -a
          ulimit -Sn; ulimit -Hn
          /usr/sbin/sshd -V 2>&1 | head -n 1 || true
      - name: macOS as the remote host (${{ matrix.sshd }} sshd)
        env:
          MACOS_SSHD: ${{ matrix.sshd }}
          MACOS_STRICT: ${{ inputs.strict && '1' || '0' }}
          # tmp_cleaners (once the TMP seam is on the ref): Apple's real tmp_cleaner as root over
          # /tmp with the clock moved forward, a day at a time, and put back. Once per run, in the
          # user-mode job; the system-mode job skips it.
          MACOS_MOVE_CLOCK: ${{ matrix.sshd == 'user' && '1' || '' }}
        run: just macos-remote
      # The tmp_cleaners case moves the clock and puts it back. If the suite was killed hard, this
      # sets the clock from the network before the artifact upload and the end of the job.
      - name: Clock safety net (hosted runner, throwaway VM)
        if: ${{ always() && matrix.sshd == 'user' }}
        run: |
          date -u
          sudo sntp -sS time.apple.com || true
          date -u
      - name: Logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-remote-${{ matrix.sshd }}
          path: |
            target/macos-remote
            ~/.local/state/fil
          if-no-files-found: ignore
          retention-days: 14

  brew:
    if: inputs.suite == 'brew' || (inputs.suite == 'all' && inputs.release_run != '')
    name: brew (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Reading another run's artifacts is `actions: read`; nothing here writes.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: arm64, os: macos-15 }
          - { label: x86_64, os: macos-15-intel }
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      RELEASE_RUN: ${{ inputs.release_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: The dry run's release files
        env:
          # Only this step has the token; the formula steps below run the checked-out ref's scripts.
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_RUN" in ''|*[!0-9]*) echo "release_run must be a release workflow run ID" >&2; exit 1 ;; esac
          # It must be a finished dry run (a dispatch) of the release workflow, not any run's artifact.
          run=$(gh run view "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --json workflowName,event,conclusion --jq '[.workflowName, .event, .conclusion] | join(" ")')
          [ "$run" = "release workflow_dispatch success" ] || { echo "run $RELEASE_RUN is '$run', not a successful release dry run" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name release-files --dir "$RUNNER_TEMP/release"
          ls -l "$RUNNER_TEMP/release"
      - name: Render the formula against those files
        run: |
          rel=$RUNNER_TEMP/release
          archive=$(ls "$rel"/fil-*-universal-apple-darwin.tar.gz)
          version=${archive##*/fil-}; version=${version%-universal-apple-darwin.tar.gz}
          echo "version $version"
          packaging/render.sh brew "$version" "$rel/SHA256SUMS" "$RUNNER_TEMP/formula" "file://$rel"
          cat "$RUNNER_TEMP/formula/fil.rb"
      - name: Scratch tap
        run: |
          brew tap-new --no-git fil-check/tap
          mkdir -p "$(brew --repository fil-check/tap)/Formula"
          cp "$RUNNER_TEMP/formula/fil.rb" "$(brew --repository fil-check/tap)/Formula/fil.rb"
      - name: brew install
        run: brew install --formula fil-check/tap/fil
      - name: brew test
        if: ${{ !cancelled() }}
        run: brew test fil-check/tap/fil
      - name: brew audit --strict
        if: ${{ !cancelled() }}
        run: brew audit --strict --formula fil-check/tap/fil
      - name: The installed layout
        if: ${{ !cancelled() }}
        run: |
          prefix=$(brew --prefix fil-check/tap/fil)
          "$prefix/bin/fil" --version
          find "$prefix" -type f | sort | head -50
      - name: Uninstall
        if: always()
        run: |
          brew uninstall --formula fil-check/tap/fil || true
          brew untap fil-check/tap || true
