[package]
name = "fil-testkit"
description = "Dev-only test support shared by the crates' tests: the scripted protocol client, the mini ssh-agent and the wait helpers. A dev-dependency only; never in a release build (just release-deps)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
fil-proto = { path = "../fil-proto" }
fil-term = { path = "../fil-term" }
fil-transport = { path = "../fil-transport" }
# The test-only mini ssh-agent: Ed25519 keys made at test time, a Unix socket.
ring = "0.17"
tokio = { version = "1", features = ["time", "net", "io-util", "rt", "sync"] }

[lints]
workspace = true
