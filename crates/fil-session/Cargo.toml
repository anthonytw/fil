[package]
name = "fil-session"
description = "One fil session: the PTY and its child, the output log, the emulator, and the subscriber protocol over any Link"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
fil-proto = { path = "../fil-proto" }
fil-term = { path = "../fil-term" }
fil-transport = { path = "../fil-transport" }
nix = { version = "0.28", default-features = false, features = ["term", "signal", "user", "process"] }
portable-pty = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
vte = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
