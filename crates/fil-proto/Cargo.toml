[package]
name = "fil-proto"
description = "fil protocol core: frames, control messages, reliable channels, epochs, scheduling (no IO, no transport)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"

[dev-dependencies]
fil-netsim = { path = "../fil-netsim" }
rand = "0.9"
tokio = { version = "1", features = ["rt", "test-util", "macros", "io-util", "time", "sync"] }

[lints]
workspace = true
