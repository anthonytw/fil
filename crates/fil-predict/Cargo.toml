[package]
name = "fil-predict"
description = "Client-side prediction overlay with erase-before-write, and the default predictor (DESIGN.md §9)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The test harness (oracle, driver, sim): not in the shipped library. Its traces hold keystrokes
# by design (docs/m3/plan.md §4.3). The tests enable it through the dev-dependency below.
testkit = []
# The PTY harness and demo: real programs on a PTY behind fil-netsim (examples/).
harness = ["testkit", "dep:fil-netsim", "dep:tokio", "dep:portable-pty", "dep:nix"]

[lints]
workspace = true

[dependencies]
fil-term = { path = "../fil-term", default-features = false, features = ["alacritty"] }
unicode-width = "0.2"
vte = "0.15"
fil-netsim = { path = "../fil-netsim", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util"], optional = true }
portable-pty = { version = "0.9", optional = true }
nix = { version = "0.28", default-features = false, features = ["term"], optional = true }

# The vt100 backend is not in the shipped binary (fil-term's default features); the tests and
# examples iterate over every backend, so they build it.
[dev-dependencies]
fil-term = { path = "../fil-term", features = ["vt100"] }
# The tests use the harness (oracle, driver, sim).
fil-predict = { path = ".", features = ["testkit"] }
# Used by examples/predict_demo.rs (needs the harness feature), and by benches/budget.rs for the
# thread CPU clock.
rustix = { version = "1", features = ["termios", "stdio", "time"] }

[[example]]
name = "predict_harness"
required-features = ["harness"]

[[example]]
name = "predict_demo"
required-features = ["harness"]

# The performance budget (docs/m3/plan.md §2.10): `cargo bench -p fil-predict --bench budget`.
[[bench]]
name = "budget"
harness = false
