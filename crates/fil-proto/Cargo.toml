[package]
name = "fil-proto"
description = "fil protocol core: frames, control messages, reliable channels, epochs, scheduling (no IO, no transport)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"

[features]
# Lets a test override the wire revision with FIL_TEST_WIRE_REVISION (src/version.rs). Never in the
# released binary: `just release-deps` fails if the feature reaches it.
test-hooks = []

[dev-dependencies]
fil-netsim = { path = "../fil-netsim" }
rand = "0.10"
tokio = { version = "1", features = ["rt", "test-util", "macros", "io-util", "time", "sync"] }

[lints]
workspace = true
