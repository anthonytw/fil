[package]
name = "fil-testbins"
description = "Test programs for the real-network harness (tests/realnet): the stand-ins (pipe-echo, pipe-probe, quic-echo, quiclink-probe) and the drivers for the real fil binary (ptydrive, sockprobe)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
fil-proto = { path = "../fil-proto" }
fil-transport = { path = "../fil-transport" }
portable-pty = "0.9"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std"] }
vt100 = "0.18"

[dev-dependencies]
bytes = "1"

[lints]
workspace = true
