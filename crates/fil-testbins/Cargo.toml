[package]
name = "fil-testbins"
description = "Stand-in programs for the real-network harness (tests/realnet): pipe-echo, pipe-probe, quic-echo and quiclink-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
fil-proto = { path = "../fil-proto" }
fil-transport = { path = "../fil-transport" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std"] }

[dev-dependencies]
bytes = "1"

[lints]
workspace = true
