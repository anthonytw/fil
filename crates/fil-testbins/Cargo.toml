[package]
name = "fil-testbins"
description = "Test programs for the real-network harness (tests/realnet): the stand-ins (pipe-echo, pipe-probe, pipe-detach, quic-echo, quiclink-probe) and the drivers for the real fil binary (ptydrive, sockprobe) and fwdprobe, the TCP end for port-forward tests (serve/connect, seeded streams, sha256)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
fil-proto = { path = "../fil-proto" }
fil-transport = { path = "../fil-transport" }
nix = { version = "0.28", default-features = false, features = ["signal"] }
portable-pty = "0.9"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "0.17"
rustix = { version = "1", features = ["net"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std"] }
vt100 = "0.18"

[lints]
workspace = true
